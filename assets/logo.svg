<!-- REPLACE WITH OWNER LOGO: Drop your official vector/PNG logo file here if available -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" fill="none" role="img" aria-label="Just Curlz Unisex Salon &amp; Spa Logo">
  <defs>
    <linearGradient id="jcOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7D33"/>
      <stop offset="100%" stop-color="#F26A1B"/>
    </linearGradient>
    <linearGradient id="jcBrassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C27F"/>
      <stop offset="100%" stop-color="#C8A25A"/>
    </linearGradient>
  </defs>

  <!-- Emblem Group (Circle 64x64 at 8,8) -->
  <g transform="translate(8, 8)">
    <!-- Outer delicate luxury ring -->
    <circle cx="32" cy="32" r="31" stroke="url(#jcBrassGrad)" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.8"/>
    <!-- Solid clean circular backdrop -->
    <circle cx="32" cy="32" r="28" fill="#F7F2EA" stroke="#1A1A1C" stroke-width="1.5"/>

    <!-- Stylized Bearded Man Profile (facing right, left half of circle) -->
    <path d="M22 20 C24 20 25.5 21.5 25.5 23.5 C25.5 25 24.5 26 23.5 26.5 C25 27 26 28.5 26 30 C26 32 25 34 23.5 35 C24 37 23.5 39 21.5 41 C19.5 43 17 43 17 43 C17 43 18 41 18.5 39 C16 38.5 15 36.5 15 34 C15 31.5 16.5 29.5 18 29 C18 27.5 18.5 25.5 19 23.5 C19.5 21.5 20.5 20 22 20 Z" fill="#1A1A1C" opacity="0.85"/>

    <!-- Stylized Woman with Wavy Hair Profile (facing left, right half of circle) -->
    <path d="M42 20 C40 20 38.5 21.5 38.5 23.5 C38.5 25 39.5 26 40.5 26.5 C39 27.5 38 29 38 31 C38 33.5 39.5 35 41 36 C42.5 37 43 39 42 41 C40.5 44 44 43 45 42 C46.5 40.5 47 38 46.5 35 C47.5 33 47.5 30 46 27 C47 24 45.5 21 42 20 Z" fill="#1A1A1C" opacity="0.85"/>
    <!-- Flowing Hair waves -->
    <path d="M44 24 C47 25 49 28 47.5 32 C46 36 48 39 46.5 42" stroke="#F26A1B" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Crossed Comb & Scissors emblem at base of medallion -->
    <g transform="translate(24, 42) scale(0.35)" stroke="#C8A25A" stroke-width="2.5" fill="none" stroke-linecap="round">
      <!-- Scissors -->
      <line x1="2" y1="2" x2="42" y2="42"/>
      <line x1="42" y1="2" x2="2" y2="42"/>
      <circle cx="2" cy="42" r="5" fill="#F7F2EA"/>
      <circle cx="42" cy="42" r="5" fill="#F7F2EA"/>
    </g>

    <!-- Centered interlocking JC Monogram overlay -->
    <!-- J in deep charcoal -->
    <path d="M28 22 H32 V36 C32 39.5 29.5 41.5 26.5 41.5 C24.5 41.5 23 40.5 22 39.5 L23.8 37 C24.5 37.6 25.5 38.2 26.5 38.2 C28 38.2 29 37.2 29 35.8 V22 Z" fill="#0E0E0F"/>
    <!-- C in burnt orange -->
    <path d="M40 24.5 L37.5 27 C39.2 28.6 39.5 31.2 38.2 33 C36.8 35 33.8 35 32 33 C30.5 31.2 30.8 28.5 32.5 26.8 C34 25.4 36.2 25.2 37.8 26.2 L39.8 23.8 C37.2 22 33.5 22.2 30.5 24.8 C27.2 27.8 27 33.2 30.2 36.5 C33.5 39.8 38.8 39.5 42 36 C44.5 33 44 27.5 40 24.5 Z" fill="url(#jcOrangeGrad)"/>
  </g>

  <!-- Wordmark Text -->
  <g transform="translate(86, 20)">
    <!-- JUST CURLZ -->
    <text x="0" y="27" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="29" font-weight="600" letter-spacing="0.08em">
      <tspan fill="#F26A1B">J</tspan><tspan fill="#EDE8DF">UST </tspan><tspan fill="#F26A1B">C</tspan><tspan fill="#EDE8DF">URLZ</tspan>
    </text>
    
    <!-- Thin Brass Separator -->
    <line x1="0" y1="36" x2="230" y2="36" stroke="url(#jcBrassGrad)" stroke-width="0.8" opacity="0.6"/>

    <!-- Category Subtitle -->
    <text x="1" y="47" font-family="'Manrope', 'Inter', system-ui, sans-serif" font-size="9" font-weight="600" fill="#C8A25A" letter-spacing="0.28em">
      UNISEX SALON &amp; SPA · RAJAHMUNDRY
    </text>
  </g>
</svg>
