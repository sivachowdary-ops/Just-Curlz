<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="glowDet" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2D2111"/>
      <stop offset="60%" stop-color="#18181A"/>
      <stop offset="100%" stop-color="#0E0E0F"/>
    </radialGradient>
    <linearGradient id="brassGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DC9B"/>
      <stop offset="100%" stop-color="#C8A25A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#glowDet)"/>
  <!-- Fresh Floral Accents & Brass Decor Element -->
  <circle cx="300" cy="270" r="160" fill="#141416" stroke="#2A2A2D" stroke-width="1.5"/>
  <circle cx="300" cy="270" r="145" fill="none" stroke="url(#brassGrad8)" stroke-width="1" stroke-dasharray="2 3"/>
  <g transform="translate(300, 260) scale(1.2)" stroke-linecap="round">
    <!-- Brass Flower Urli / Bowl -->
    <ellipse cx="0" cy="40" rx="75" ry="24" fill="#202024" stroke="url(#brassGrad8)" stroke-width="2"/>
    <ellipse cx="0" cy="36" rx="65" ry="18" fill="#1A1815" stroke="url(#brassGrad8)" stroke-width="1"/>
    <!-- Floating Marigolds / Lotus Petals in Bowl -->
    <circle cx="-30" cy="35" r="9" fill="#F26A1B"/>
    <circle cx="0" cy="34" r="11" fill="#FFA500"/>
    <circle cx="32" cy="36" r="9" fill="#F26A1B"/>
    <circle cx="-15" cy="40" r="7" fill="#C8A25A"/>
    <circle cx="16" cy="40" r="7" fill="#C8A25A"/>
    <!-- Ambient floating fragrance waves -->
    <path d="M-40 -40 Q-30 -70 -10 -60 Q10 -50 20 -70" stroke="url(#brassGrad8)" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>
  <text x="300" y="480" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#C8A25A" letter-spacing="0.25em">
    CURATED SALON DETAILS
  </text>
  <text x="300" y="510" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" fill="#A19B90" letter-spacing="0.1em">
    FRESH FLOWERS · AROMATIC PEACE · BRASS ACCENTS
  </text>
</svg>
