<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="glowGroom" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#261811"/>
      <stop offset="60%" stop-color="#18181A"/>
      <stop offset="100%" stop-color="#0E0E0F"/>
    </radialGradient>
    <linearGradient id="brassGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DC9B"/>
      <stop offset="100%" stop-color="#C8A25A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#glowGroom)"/>
  <!-- Straight Razor & Comb Barbershop Art -->
  <circle cx="300" cy="270" r="160" fill="#141416" stroke="#2A2A2D" stroke-width="1.5"/>
  <circle cx="300" cy="270" r="145" fill="none" stroke="url(#brassGrad4)" stroke-width="1" stroke-dasharray="3 4"/>
  <g transform="translate(300, 270)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Straight Razor -->
    <path d="M-80 -40 L40 60 L60 40 L-60 -60 Z" fill="#202024" stroke="url(#brassGrad4)" stroke-width="2"/>
    <path d="M-10 10 L80 -70 L100 -50 L10 30 Z" fill="#18181B" stroke="#F26A1B" stroke-width="2"/>
    <circle cx="0" cy="20" r="4" fill="#C8A25A"/>
    <!-- Barber Pole Striping Accents -->
    <path d="M-120 70 L-60 70 M-120 85 L-40 85 M-120 100 L-60 100" stroke="#F26A1B" stroke-width="2"/>
  </g>
  <text x="300" y="480" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#C8A25A" letter-spacing="0.25em">
