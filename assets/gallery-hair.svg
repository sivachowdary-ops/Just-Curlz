<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2C1910"/>
      <stop offset="60%" stop-color="#18181A"/>
      <stop offset="100%" stop-color="#0E0E0F"/>
    </radialGradient>
    <linearGradient id="brassGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DC9B"/>
      <stop offset="100%" stop-color="#C8A25A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#glow1)"/>
  <!-- Decorative Hair Styling Mirror & Station Frame -->
  <rect x="70" y="50" width="460" height="500" rx="230" fill="none" stroke="url(#brassGrad1)" stroke-width="1.5" opacity="0.6"/>
  <rect x="85" y="65" width="430" height="470" rx="215" fill="#141416" stroke="#2A2A2D" stroke-width="1"/>
  <!-- Hair Styling Shears & Comb -->
  <g transform="translate(300, 270) scale(1.6)" stroke="#F26A1B" stroke-width="2.5" fill="none" stroke-linecap="round">
    <!-- Scissor Blades -->
    <path d="M-30 -50 L20 40 M20 -50 L-30 40"/>
    <circle cx="-32" cy="45" r="9" stroke="url(#brassGrad1)" fill="#1A1A1C"/>
    <circle cx="22" cy="45" r="9" stroke="url(#brassGrad1)" fill="#1A1A1C"/>
    <circle cx="-5" cy="-5" r="3" fill="#C8A25A"/>
  </g>
  <!-- Modern Hair Wave Flourish -->
  <path d="M150 420 Q220 370 300 420 T450 420" stroke="url(#brassGrad1)" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M180 440 Q250 395 300 440 T420 440" stroke="#F26A1B" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Label Tag -->
  <text x="300" y="505" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#C8A25A" letter-spacing="0.25em">
    PRECISION CUTTING &amp; STYLING
  </text>
</svg>
